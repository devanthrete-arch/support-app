<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AF-010 · Responsive verification</title><style>body{font:14px system-ui;background:#e7ecef;margin:20px;color:#172a38}main{display:flex;gap:20px;align-items:flex-start}iframe{border:1px solid #b9c9d2;background:white;height:844px}h2{font-size:16px}</style></head><body><h1>AF-010 · Responsive verification</h1><p>Actual app pages in isolated viewport frames. Sign in to both local origins before opening this harness.</p><main><section><h2>Customer · 390px</h2><iframe id="customer" title="Customer support at phone width" width="390"></iframe></section><section><h2>Support desk · 700px</h2><iframe id="operator" title="Support desk at narrow width" width="700"></iframe></section></main><script>
